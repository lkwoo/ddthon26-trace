# PetClinic application config (TRACE demo excerpt)
# 원본: spring-petclinic-rest (Apache-2.0), 데모용으로 축약.
# NOTE(demo): 실제 시크릿 없음 — 모든 자격증명은 플레이스홀더/더미값 (R2 준수).

server.port=9966
spring.datasource.url=jdbc:h2:mem:petclinic
spring.datasource.username=demo_user
# 데모용 더미 값 — 실제 비밀번호 아님. 배포 시 환경변수로 주입할 것.
spring.datasource.password=CHANGE_ME_PLACEHOLDER
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=true

# Billing 설정
# 충돌 C-9: maintenance-notes BILLING-RULE-1 은 세금이 기본 적용(enforced)이라 기술하나,
# 여기서는 기본값이 disabled 로 되어 있어 문서-설정 드리프트가 존재한다.
billing.tax.enforcement=disabled
billing.currency=KRW
