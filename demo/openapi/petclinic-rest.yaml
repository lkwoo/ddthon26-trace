openapi: 3.0.1
info:
  title: PetClinic REST API (TRACE demo excerpt)
  description: >
    Owner/Pet 관련 경로만 발췌한 데모용 OpenAPI 명세.
    원본: spring-petclinic-rest (Apache-2.0), 데모용으로 축약·개변됨.
  version: "1.0.0"
paths:
  /owners:
    get:
      summary: List owners
      operationId: listOwners
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Owner"
    post:
      summary: Create an owner
      operationId: addOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Owner"
      responses:
        "201":
          description: Created
  /owners/{ownerId}:
    get:
      summary: Get an owner by id
      operationId: getOwner
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
  /owners/{ownerId}/pets:
    get:
      summary: List an owner's pets
      operationId: listPets
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
components:
  schemas:
    Owner:
      type: object
      # NOTE(demo): email 속성 없음 (요구사항 REQ-2 신규 정책 미반영 → 충돌 C-3)
      required:
        - firstName
        - lastName
      properties:
        id:
          type: integer
          format: int32
        firstName:
          type: string
          maxLength: 30
        lastName:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 80
        telephone:
          type: string
          # NOTE(demo): 요구사항은 20자이나 여기서는 10 (충돌 C-1)
          maxLength: 10
    Pet:
      type: object
      required:
        - name
        - type
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 30
        birthDate:
          type: string
          format: date
          # NOTE(demo): 미래일자 제약을 스펙에 표기하지 않음 (드리프트 맥락, 충돌 C-2)
        type:
          $ref: "#/components/schemas/PetType"
    PetType:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 80
