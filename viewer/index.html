<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knowledge Store — Wiki Viewer</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- D3 v7. Loaded from CDN; if offline, the viewer still renders the wiki
       content and shows a notice for the tree/graph views. -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body>
  <header>
    <h1>Knowledge Store</h1>
    <nav>
      <button data-testid="tab-wiki" class="tab active" data-view="wiki">Wiki</button>
      <button data-testid="tab-tree" class="tab" data-view="tree">Structure Tree</button>
      <button data-testid="tab-graph" class="tab" data-view="graph">Dependency Graph</button>
    </nav>
  </header>

  <main>
    <section id="view-wiki" class="view active">
      <div class="wiki-layout">
        <aside class="wiki-toc">
          <div id="wiki-search-bar">
            <input data-testid="wiki-search-input" id="wiki-search" type="search"
                   placeholder="Search pages…" />
          </div>
          <div id="wiki-nav" class="wiki-nav"></div>
        </aside>
        <div id="wiki-content" class="wiki-content"></div>
      </div>
    </section>
    <section id="view-tree" class="view">
      <div id="tree" class="canvas"></div>
      <div id="tree-info" class="node-info" hidden></div>
    </section>
    <section id="view-graph" class="view">
      <div id="graph" class="canvas"></div>
      <div id="graph-info" class="node-info" hidden></div>
    </section>
  </main>

  <footer>
    <span id="status">Loading…</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
