[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace-ki"
version = "0.1.0"
description = "TRACE — 기능 중심·근거 기반 개발자 지식 인텔리전스 MCP 서버"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TRACE Team" }]
keywords = ["mcp", "developer-knowledge", "claude", "conflict-detection"]
dependencies = [
    "mcp>=2.0.0,<3",
    "anthropic>=0.40.0",
    "pyyaml>=5.4",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[project.scripts]
trace = "traceki.cli:main"
trace-mcp = "traceki.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["traceki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
